[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pcb-inspection"
version = "0.1.0"
description = "Local YOLO PCB inspection with approximate defect overlays"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1",
  "pydantic>=2.10,<3", "pillow>=12,<13", "numpy>=2,<3", "pyyaml>=6,<7",
]

[project.optional-dependencies]
ml = ["ultralytics>=8.4,<9"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/pcb_inspection"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 105

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
